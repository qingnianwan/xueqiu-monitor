name: 雪球监控

# 调度：GitHub 原生 cron 兜底 + 自我接力。
# 历史经验：GitHub cron 极不可靠（实测 13 小时只触发 1 次），
# 所以主路径是「长驻循环 + 结束前 dispatch 自己」，cron 只做断链重启。
on:
  schedule:
    - cron: '*/30 * * * *'   # 兜底重启
  workflow_dispatch: {}      # 手动触发 / 自我接力

permissions:
  contents: write
  actions: write

concurrency:
  group: xueqiu-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: 注入 cookie 与邮箱
        env:
          XUEQIU_COOKIES: ${{ secrets.XUEQIU_COOKIES }}
          QQ_USER: ${{ secrets.QQ_USER }}
          QQ_PASS: ${{ secrets.QQ_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          mkdir -p xueqiu_sub
          printf '%s' "$XUEQIU_COOKIES" > xueqiu_sub/cookies.json
          node -e "
            const fs=require('fs');
            fs.writeFileSync('xueqiu_sub/email.json', JSON.stringify({
              user: process.env.QQ_USER,
              pass: process.env.QQ_PASS,
              to: process.env.EMAIL_TO
            }));
          "
          echo "cookie bytes: $(wc -c < xueqiu_sub/cookies.json)"

      - name: 起始状态快照
        run: node poll_xueqiu_10m.mjs --status || true

      - name: 持续轮询（每 3 分钟一轮，连跑约 5h40m）
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          DEADLINE=$(( $(date +%s) + 340*60 ))
          i=0
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            i=$((i+1))
            echo "==================== cycle $i @ $(date -u +%H:%M:%S)Z ===================="
            node poll_xueqiu_10m.mjs --once || echo "poll 退出码非 0（继续循环）"

            # 每 30 轮（约 90 分钟）回写一次，而不是 7 轮。
            # 四个文件合计约 500KB，回写太勤会让仓库快速膨胀（7 轮≈35MB/天）。
            # 为什么四个都要提交、不能省：
            #   · health.json      —— 看门狗判活依据，不提交看门狗会误报
            #   · state.json       —— seen 去重 + 断档检测
            #   · deliveries.json  —— notified_ids 是去重的唯一事实依据，不提交会重复发信
            #   · archive.md       —— 帖子正文归档，丢了就不可回溯（雪球只给最新 20 条）
            if [ $((i % 30)) -eq 0 ]; then
              git add xueqiu_sub/state.json xueqiu_sub/health.json xueqiu_sub/deliveries.json xueqiu_sub/archive.md 2>/dev/null
              git diff --cached --quiet || { git commit -q -m "chore: state [skip ci]"; git push -q || true; }
            fi

            sleep 140
          done

          git add xueqiu_sub/state.json xueqiu_sub/health.json xueqiu_sub/deliveries.json xueqiu_sub/archive.md 2>/dev/null
          git diff --cached --quiet || { git commit -q -m "chore: state [skip ci]"; git push -q || true; }

          if [ -n "$GH_PAT" ]; then
            for k in 1 2 3; do
              code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
                -H "Authorization: Bearer $GH_PAT" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/monitor.yml/dispatches" \
                -d '{"ref":"main"}')
              echo "self-chain $k -> HTTP $code"
              [ "$code" = "204" ] && break
              sleep 10
            done
          else
            echo "GH_PAT 未配置，跳过自我接力（依赖 cron 兜底）"
          fi
